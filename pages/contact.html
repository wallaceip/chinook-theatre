<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinook Theatre - Contact</title>
    <!-- style sheets -->
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/styles.css">
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <a href="../index.html" class="flex logo">
            <img src="../images/logo.svg" alt="Chinook Theatre ticket logo">
            <h1>Chinook Theatre</h1>
        </a>
        <nav>
            <a href="../index.html">Home</a>
            <a href="tickets.html">Tickets</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="contact" id="contact-page">
        <h2>We'd love to hear from you!</h2>
        <form>
            <div class="flex">
                <label for="user-name">Your name:</label>
                <input type="text" id="user-name">
            </div>
            <div class="flex">
                <label for="user-email">Your email:</label>
                <input type="email" id="user-email">
            </div>
            <div class="flex">
                <label for="user-message">Your message:</label>
                <textarea id="user-message"></textarea>
            </div>
            <button class="fake-button teal-hover" type="submit" id="submit-button">Send message</button>
        </form>
    </main>

    <footer>
        <p>Chinook Theatre &mdash; 123 Prairie Ave, Calgary AB</p>
        <p>Box office: (403) 555-0134 &middot; Open Wed&ndash;Sun</p>
    </footer>

    <!-- javascript -->
    <script src="../scripts/contact.js"></script>
</body>

</html>
